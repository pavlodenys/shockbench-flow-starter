r<title>Провідник ShockBench-Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a sticky control bar over a week timeline, then the network map beside an inspector, then five tabs that follow
   one week's loop: what the agent sees, what it does, what it costs. */
:root {
  --bg: #eef2f5;
  --surface: #ffffff;
  --surface2: #f4f7f9;
  --ink: #14202b;
  --ink2: #4a5b6a;
  --ink3: #7b8a97;
  --line: #d6dee5;
  --accent: #0a6c8c;
  --accent-soft: #d9eef5;
  --ok: #1f8a5b;
  --ok-soft: #dcf1e7;
  --warn: #b86e00;
  --warn-soft: #faecd0;
  --bad: #c8372d;
  --bad-soft: #fadfdb;
  --k0: #2a6fdb;
  --k1: #7a5bd0;
  --k2: #d4781f;
  --k3: #1c8d78;
  --c0: #3b78c4;
  --c1: #d1572f;
  --c2: #7a62c8;
  --c3: #b8962e;
  --c4: #8f6fa8;
  --c5: #c23b5a;
  --c6: #6b7a86;
  --c7: #e0902a;
  --a0: #0a6c8c;
  --a1: #c2501f;
  --a2: #7a62c8;
  --a3: #1f8a5b;
  --a4: #b8962e;
  --naive: #7b8a97;
  --shadow: 0 1px 2px rgb(20 32 43 / 0.06), 0 4px 14px rgb(20 32 43 / 0.05);
  --font: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141a;
    --surface: #152029;
    --surface2: #1a2732;
    --ink: #e6edf2;
    --ink2: #a5b4c0;
    --ink3: #75869a;
    --line: #28384a;
    --accent: #4cc0e0;
    --accent-soft: #123846;
    --ok: #4cc491;
    --ok-soft: #13342a;
    --warn: #e6a53a;
    --warn-soft: #3a2c10;
    --bad: #f0675c;
    --bad-soft: #3d1c19;
    --k0: #6aa0f5;
    --k1: #a48ae8;
    --k2: #ec9b4e;
    --k3: #4cc4ac;
    --c0: #6aa0f5;
    --c1: #f08a62;
    --c2: #a48ae8;
    --c3: #d6b85a;
    --c4: #bc9bd6;
    --c5: #ee6f8c;
    --c6: #93a3b0;
    --c7: #f0b05a;
    --a0: #4cc0e0;
    --a1: #f0865a;
    --a2: #a48ae8;
    --a3: #4cc491;
    --a4: #d6b85a;
    --naive: #93a3b0;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141a;
  --surface: #152029;
  --surface2: #1a2732;
  --ink: #e6edf2;
  --ink2: #a5b4c0;
  --ink3: #75869a;
  --line: #28384a;
  --accent: #4cc0e0;
  --accent-soft: #123846;
  --ok: #4cc491;
  --ok-soft: #13342a;
  --warn: #e6a53a;
  --warn-soft: #3a2c10;
  --bad: #f0675c;
  --bad-soft: #3d1c19;
  --k0: #6aa0f5;
  --k1: #a48ae8;
  --k2: #ec9b4e;
  --k3: #4cc4ac;
  --c0: #6aa0f5;
  --c1: #f08a62;
  --c2: #a48ae8;
  --c3: #d6b85a;
  --c4: #bc9bd6;
  --c5: #ee6f8c;
  --c6: #93a3b0;
  --c7: #f0b05a;
  --a0: #4cc0e0;
  --a1: #f0865a;
  --a2: #a48ae8;
  --a3: #4cc491;
  --a4: #d6b85a;
  --naive: #93a3b0;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
button, select, input { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); }
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }

/* top bar */
.top { background: var(--bg); padding-block: 12px 8px; border-bottom: 1px solid var(--line); }
@media (min-width: 1041px) and (min-height: 780px) { .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; } }
.top-row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.brand { display: flex; flex-direction: column; gap: 0; min-width: 0; margin-right: auto; }
.brand b { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { color: var(--ink2); font-size: 12px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > label, .lbl { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink3); font-weight: 600; }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; max-width: 100%; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.seg i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.scrub { display: flex; align-items: center; gap: 8px; flex: 1 1 360px; min-width: 0; }
.scrub input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, select:focus-visible, .tabs button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.wk { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 110px; }
.timeline { margin-top: 6px; }
.timeline svg { display: block; width: 100%; height: auto; }

/* cards */
.grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
@media (max-width: 1040px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
.card > header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 12px 14px 0; }
.card h2 { margin: 0; font-size: 15px; font-weight: 650; }
.card .body { padding: 12px 14px 14px; min-width: 0; }
.hint { color: var(--ink2); margin: 0 0 10px; max-width: 78ch; }
.map-wrap { padding: 4px 6px 8px; }
#map { width: 100%; height: auto; display: block; touch-action: manipulation; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 0 14px 12px; color: var(--ink2); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid; }

/* svg map */
.edge path.line { fill: none; stroke-linecap: round; }
.edge .hit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
.edge.ok path.line { stroke: var(--ink3); }
.edge.limited path.line { stroke: var(--warn); }
.edge.blocked path.line { stroke: var(--bad); stroke-dasharray: 7 5; }
.edge.grid path.line { stroke: var(--ink3); stroke-dasharray: 2 5; }
.edge.dim { opacity: 0.18; }
.edge.sel path.line { filter: drop-shadow(0 0 4px var(--accent)); }
.edge:hover path.line { stroke-opacity: 1; }
.elabel rect { fill: var(--surface); stroke: var(--line); }
.elabel text, .ax, .nsub { font-family: var(--font); fill: var(--ink2); font-size: 11px; }
.elabel text { font-variant-numeric: tabular-nums; }
.node { cursor: pointer; }
.node rect.card { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.node:hover rect.card { stroke: var(--accent); }
.node.sel rect.card { stroke: var(--accent); stroke-width: 2.4; }
.node .nname { font-size: 12.5px; font-weight: 650; fill: var(--ink); font-family: var(--font); }
.node .band { opacity: 0.9; }
.node .stockbar { fill: var(--surface2); }
.node.chk rect.card { stroke-width: 2.5; }
.node.chk.bad rect.card { stroke: var(--bad); }
.node.chk.warn rect.card { stroke: var(--warn); }
.node.chk.good rect.card { stroke: var(--ok); }

/* tabs */
.tabs-card { margin-top: 16px; }
.tabs { display: flex; flex-wrap: wrap; gap: 0; padding: 8px 10px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 12px; cursor: pointer; color: var(--ink2); font-weight: 600; white-space: nowrap; display: inline-flex; align-items: baseline; gap: 6px; }
.tabs button small { font-weight: 400; color: var(--ink3); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab-body { padding: 14px; min-width: 0; }
.sec { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; background: var(--surface); }
.sec > summary { cursor: pointer; padding: 10px 12px; font-weight: 650; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::before { content: "▸"; color: var(--ink3); width: 12px; }
.sec[open] > summary::before { content: "▾"; }
.sec .inner { padding: 0 12px 12px; min-width: 0; }
.sec .sub { font-weight: 400; color: var(--ink2); }
.fld { font-family: var(--mono); font-size: 11px; background: var(--surface2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--ink2); white-space: nowrap; }
.chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }

/* tables */
.tbl { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface2); }
tr.sel td { background: var(--accent-soft); }
tr.dev td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
tr.bad td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
.na { color: var(--ink3); }
.sm { font-size: 12px; color: var(--ink2); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.mute { background: var(--surface2); color: var(--ink2); }
.bar { display: inline-block; width: 90px; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; vertical-align: middle; position: relative; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.bar.wide { width: 140px; }
.bar b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: 0.55; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }

/* misc blocks */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface2); min-width: 0; }
.kpi .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.kpi .l { color: var(--ink2); font-size: 12px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.two > * { min-width: 0; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font); fill: var(--ink2); font-size: 11px; }
.chart .grid line { stroke: var(--line); }
.insp h3 { margin: 0; font-size: 16px; }
.insp .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 10px 0; }
.insp .kv dt { color: var(--ink2); }
.insp .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.insp h4 { margin: 14px 0 4px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink3); }
.linklist { display: flex; flex-direction: column; gap: 2px; }
.linklist button { text-align: left; background: none; border: 0; padding: 4px 6px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; justify-content: space-between; }
.linklist button:hover { background: var(--surface2); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-bottom: 14px; }
.step { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface2); }
.step b { display: block; margin-bottom: 2px; }
.step span { color: var(--ink2); font-size: 13px; }
.note { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: 0 6px 6px 0; margin: 0 0 12px; max-width: 90ch; }
.note.bad { border-color: var(--bad); background: var(--bad-soft); }
.evlist { display: flex; flex-direction: column; gap: 2px; }
.ev { display: grid; grid-template-columns: 62px 1fr; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; text-align: left; background: none; border: 0; width: 100%; }
.ev:hover { background: var(--surface2); }
.ev.now { background: var(--accent-soft); }
.ev .w { font-variant-numeric: tabular-nums; color: var(--ink2); font-weight: 600; }
.ev .tt { min-width: 0; overflow-wrap: anywhere; }
.sev { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.sev.bad { background: var(--bad); } .sev.warn { background: var(--warn); } .sev.info { background: var(--ink3); }
.gl td:first-child { white-space: nowrap; }
.theme { margin-left: 6px; }
.foot { color: var(--ink3); font-size: 12px; margin-top: 18px; }
@media (max-width: 560px) { .brand { flex-basis: 100%; } .wk { min-width: 0; } }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width 0.2s; } }
</style>

<div class="wrap">
  <div class="top">
    <div class="top-row">
      <div class="brand"><b>Провідник ShockBench-Flow</b><span id="subtitle"></span></div>
      <div class="field"><label for="selEp">Епізод</label><select id="selEp"></select></div>
      <div class="field"><span class="lbl">Агент</span><div class="seg" id="segAgent" role="group" aria-label="Агент"></div></div>
      <button class="btn theme" id="btnTheme" title="Світла або темна тема">Тема</button>
    </div>
    <div class="top-row" style="margin-top:8px">
      <div class="scrub">
        <button class="btn" id="btnPrev" aria-label="Попередній тиждень">◀</button>
        <button class="btn" id="btnPlay" aria-label="Відтворити">▶ Грати</button>
        <button class="btn" id="btnNext" aria-label="Наступний тиждень">▶</button>
        <input type="range" id="rng" min="1" value="1" step="1" aria-label="Тиждень">
        <span class="wk" id="wkLabel"></span>
      </div>
    </div>
  </div>
  <div class="timeline" id="timeline"></div>

  <div class="grid">
    <section class="card" aria-label="Карта мережі">
      <header>
        <h2>Мережа на початку тижня <span class="sm" id="mapWeek"></span></h2>
        <div class="field" style="flex-direction:row;align-items:center;gap:8px"><label for="selLabel">Підписи на маршрутах</label>
          <select id="selLabel">
            <option value="flow">Скільки відправлено</option>
            <option value="util">Завантаження, % від норми</option>
            <option value="cap">Потужність цього тижня</option>
            <option value="transit">У дорозі зараз</option>
            <option value="tariff">Мито</option>
            <option value="none">Без підписів</option>
          </select></div>
      </header>
      <div class="map-wrap"><svg id="map" viewBox="0 0 1000 640" role="img" aria-label="Схема мережі постачання"></svg></div>
      <div class="legend">
        <span><i style="border-color:var(--ink3)"></i>маршрут працює</span>
        <span><i style="border-color:var(--warn)"></i>потужність урізана або протока частково закрита</span>
        <span><i style="border-color:var(--bad);border-top-style:dashed"></i>заборонено або закрито</span>
        <span><i style="border-color:var(--ink3);border-top-style:dotted"></i>зв'язок енергомережі з фабрикою</span>
        <span>Товщина лінії: скільки агент реально відправив відносно норми.</span>
      </div>
    </section>
    <aside class="card insp" aria-label="Деталі"><div class="body" id="insp"></div></aside>
  </div>

  <section class="card tabs-card" aria-label="Тиждень крок за кроком">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="tab-body" id="tabBody" role="tabpanel"></div>
  </section>
  <p class="foot" id="foot"></p>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const N = D.network, T = N.T;
const AGENTS = D.agentOrder;
const S = { ep: 0, agent: AGENTS[0], w: 0, sel: null, tab: "obs", label: "flow", compare: false, onlyDev: false, filt: { bad: true, warn: true, info: true }, play: null };
const KCOL = ["var(--k0)", "var(--k1)", "var(--k2)", "var(--k3)"];
const CCOL = ["var(--c0)", "var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)", "var(--c7)"];
const ACOL = ["var(--a0)", "var(--a1)", "var(--a2)", "var(--a3)", "var(--a4)"];
const agentColor = (key) => ACOL[AGENTS.indexOf(key) % ACOL.length];
const NODE_COL = { source: "var(--k0)", material: "var(--k1)", grid: "var(--c3)", chokepoint: "var(--bad)", fab: "var(--k3)", osat: "var(--k2)", sink: "var(--c5)", terminal: "var(--ink3)" };

const E = () => D.episodes[S.ep];
const A = () => E().agents[S.agent];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = (s, el = document) => el.querySelector(s);
const NA = '<span class="na" title="Агент цього не бачить: значення не спостерігається">—</span>';
const NF = [0, 1, 2, 3].map((d) => new Intl.NumberFormat("uk-UA", { maximumFractionDigits: d }));
function num(v, d) {
  if (v == null || Number.isNaN(v)) return NA;
  const a = Math.abs(v);
  return NF[d ?? (a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3)].format(v);
}
function pct(v, d = 0) { return v == null ? NA : (v * 100).toFixed(d).replace(".", ",") + "%"; }
function usd(v) {
  if (v == null) return NA;
  const a = Math.abs(v), sign = v < 0 ? "−" : "";
  if (a >= 1e9) return sign + "$" + NF[2].format(a / 1e9) + " млрд";
  if (a >= 1e6) return sign + "$" + NF[1].format(a / 1e6) + " млн";
  if (a >= 1e3) return sign + "$" + NF[0].format(a / 1e3) + " тис";
  return sign + "$" + NF[0].format(a);
}
const code = (...c) => `<span class="chips">${c.map((x) => `<code class="fld">${esc(x)}</code>`).join("")}</span>`;
function bar(v, max, color, extra = "", wide = false) {
  if (v == null || !max) return `<span class="bar${wide ? " wide" : ""}"></span>`;
  const w = Math.max(0, Math.min(1, v / max)) * 100;
  return `<span class="bar${wide ? " wide" : ""}"><i style="width:${w}%;${color ? `background:${color}` : ""}"></i>${extra}</span>`;
}
const kName = (k) => N.commodities[k].label;
const node = (i) => N.nodes[i];
const edge = (i) => N.edges[i];
const sum = (a) => a.reduce((x, y) => x + (y || 0), 0);
const cumsum = (a) => { let s = 0; return a.map((v) => (s += v || 0)); };
const costTotals = (a) => a.costs.map(sum);

/* derived facts of the current week */
function chkOpen(a, w, nodeIdx) {
  const p = N.chokepoints.indexOf(nodeIdx);
  return p < 0 ? null : a.open[w][p];
}
function edgeFlow(a, w, e, key = "exec") {
  let s = 0;

function stackChart(a, w) {

  const tot = costTotals(a), max = niceMax(Math.max(...tot));

  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Витрати по компонентах"><g class="grid">`;
  for (let i = 0; i <= 4; i++) { const v = (max * i) / 4; s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${usd(v)}</text>`; }
  s += "</g>";
  a.costs.forEach((row, t) => {
    let acc = 0; const x = L + t * bw;
    s += `<g data-week="${t}" style="cursor:pointer"><rect x="${x}" y="${top}" width="${bw}" height="${H - B - top}" fill="${t === w ? "var(--accent-soft)" : "transparent"}"/>`;
    row.forEach((v, i) => { if (v <= 0) return; const y0 = y(acc + v), y1 = y(acc); acc += v; s += `<rect x="${x + 2}" y="${y0}" width="${bw - 4}" height="${Math.max(0, y1 - y0)}" style="fill:${CCOL[i]}"><title>Тиждень ${t + 1}, ${esc(N.costs[i].label)}: ${usd(v)}</title></rect>`; });
    s += "</g>";

  });
  const naive = E().naive.costs.map(sum);
  s += `<path d="${naive.map((v, i) => `${i ? "L" : "M"}${(L + i * bw + bw / 2).toFixed(1)},${y(v).toFixed(1)}`).join("")}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>`;
  return s;
}
function cumChart(w) {
  const W = 860, H = 260, L = 56, R = 70, top = 12, B = 24;
  const series = AGENTS.map((k) => ({ k, label: E().agents[k].label, v: cumsum(costTotals(E().agents[k])), col: agentColor(k) }));
  series.push({ k: "naive", label: "Naive (норма)", v: cumsum(E().naive.costs.map(sum)), col: "var(--naive)", dash: true });
  const max = niceMax(Math.max(...series.map((s) => s.v[T - 1]))), x = (i) => L + (i / (T - 1)) * (W - L - R), y = (v) => H - B - (v / max) * (H - B - top);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Накопичені витрати"><g class="grid">`;
  for (let i = 0; i <= 4; i++) { const v = (max * i) / 4; s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${usd(v)}</text>`; }
  s += `</g><line x1="${x(w)}" x2="${x(w)}" y1="${top}" y2="${H - B}" stroke="var(--ink3)" stroke-dasharray="3 3"/>`;
  [0, 4, 9, 14, 19, 24].filter((i) => i < T).concat([T - 1]).forEach((i) => (s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${i + 1}</text>`));
  const ends = [];
  series.forEach((sr) => {
    s += `<path d="${sr.v.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("")}" fill="none" stroke="${sr.col}" stroke-width="${sr.k === S.agent ? 3 : 1.8}" ${sr.dash ? 'stroke-dasharray="5 4"' : ""}/>`;
    ends.push([y(sr.v[T - 1]), sr]);
  });
  ends.sort((p, q) => p[0] - q[0]);
  let last = -99;
  ends.forEach(([yy, sr]) => { const ty = Math.max(yy, last + 13); last = ty; s += `<text x="${W - R + 6}" y="${ty + 4}" style="fill:${sr.col};font-weight:600">${esc(sr.label.length > 12 ? sr.label.slice(0, 11) + "…" : sr.label)}</text>`; });
  return s + "</svg>";
}

function tabEv() {

function stop() { if (S.play) { clearInterval(S.play); S.play = null; } }

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-edge],[data-node],[data-week],[data-agent],[data-tab],[data-pick],[data-clear],[data-filt]");
  if (!t) return;
  if (t.dataset.edge != null) { S.sel = { t: "edge", i: +t.dataset.edge }; }
  else if (t.dataset.node != null) { S.sel = { t: "node", i: +t.dataset.node }; }
  else if (t.dataset.week != null) { S.w = +t.dataset.week; }
  else if (t.dataset.agent) { S.agent = t.dataset.agent; }
  else if (t.dataset.pick) { S.agent = t.dataset.pick; }
  else if (t.dataset.tab) { S.tab = t.dataset.tab; }
  else if (t.dataset.clear != null) { S.sel = null; }
  else if (t.dataset.filt) { S.filt[t.dataset.filt] = !S.filt[t.dataset.filt]; }
  renderAll();
});
document.addEventListener("change", (ev) => {
  const id = ev.target.id;
  if (id === "chkDev") S.onlyDev = ev.target.checked;
  else if (id === "chkCmp") S.compare = ev.target.checked;
  else if (id === "selLabel") S.label = ev.target.value;
  else if (id === "selEp") { S.ep = +ev.target.value; S.w = defaultWeek(); S.sel = defaultSel(); }
  else return;
  renderAll();
});
$("#rng").addEventListener("input", (ev) => { S.w = +ev.target.value - 1; renderAll(); });
$("#btnPrev").addEventListener("click", () => setWeek(S.w - 1));
$("#btnNext").addEventListener("click", () => setWeek(S.w + 1));
$("#btnPlay").addEventListener("click", () => {
  if (S.play) { stop(); renderAll(); return; }
  if (S.w >= T - 1) S.w = 0;
  S.play = setInterval(() => { if (S.w >= T - 1) { stop(); renderAll(); } else setWeek(S.w + 1); }, 650);
  renderAll();
});
$("#btnTheme").addEventListener("click", () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
});
document.addEventListener("keydown", (ev) => {
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.type !== "checkbox") return;
  if (ev.key === "ArrowLeft") { ev.preventDefault(); setWeek(S.w - 1); }
  if (ev.key === "ArrowRight") { ev.preventDefault(); setWeek(S.w + 1); }
});
function defaultWeek() { const c = firstClosure(A()); return c >= 0 ? c : 0; }
function defaultSel() { return N.chokepoints.length ? { t: "node", i: N.chokepoints[0] } : null; }

buildControls();
S.w = defaultWeek();
S.sel = defaultSel();
$("#foot").textContent = "Усі дані записано з гри агентів на епізодах розробницької вибірки. Клавіші ← і → перемикають тижні.";
renderAll(false);
</script>
